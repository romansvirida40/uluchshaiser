name: Build
on: [workflow_dispatch, push]
jobs:
  win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --target ULUCHSHAISER_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: ULUCHSHAISER-VST3
          path: build/ULUCHSHAISER_artefacts/Release/VST3/ULUCHSHAISER.vst3
